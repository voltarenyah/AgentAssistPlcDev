name: Codex local revision worker

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run:
    if: github.event.label.name == 'codex:revise'
    runs-on: [self-hosted, Windows, X64, agentassist-local]
    steps:
      - name: Checkout trusted worker revision
        uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Dispatch issue revision
        if: github.event_name == 'issues' && github.event.label.name == 'codex:revise'
        shell: powershell
        env:
          CODEX_REPOSITORY: ${{ github.repository }}
          CODEX_ISSUE_NUMBER: ${{ github.event.issue.number }}
          CODEX_ACTOR: ${{ github.actor }}
          CODEX_EVENT_NAME: ${{ github.event.label.name }}
        run: |
          $issueNumber = [int]$env:CODEX_ISSUE_NUMBER
          $workerConfigPath = Join-Path $env:LOCALAPPDATA 'AutomationWorkbench\CodexWorker\config.json'
          if (-not (Test-Path -LiteralPath $workerConfigPath -PathType Leaf)) {
              throw "Codex worker configuration was not found at '$workerConfigPath'."
          }
          $workerConfig = Get-Content -Raw -LiteralPath $workerConfigPath | ConvertFrom-Json
          $repositoryRoot = [string]$workerConfig.repositoryRoot
          $dataRoot = [string]$workerConfig.dataRoot
          if ([string]::IsNullOrWhiteSpace($repositoryRoot) -or [string]::IsNullOrWhiteSpace($dataRoot)) {
              throw 'Codex worker configuration must specify repositoryRoot and dataRoot.'
          }
          Write-Host "CODEX WORKER | Issue #$issueNumber | REVISION DISPATCHING | event $env:CODEX_EVENT_NAME"
          & .\scripts\codex-worker\Invoke-Revision.ps1 `
              -Repository ([string]$env:CODEX_REPOSITORY) `
              -IssueNumber $issueNumber `
              -Actor ([string]$env:CODEX_ACTOR) `
              -EventName ([string]$env:CODEX_EVENT_NAME) `
              -RepositoryRoot $repositoryRoot `
              -DataRoot $dataRoot | Out-Null

      - name: Dispatch pull request revision
        if: github.event_name == 'pull_request' && github.event.label.name == 'codex:revise'
        shell: powershell
        env:
          CODEX_REPOSITORY: ${{ github.repository }}
          CODEX_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          CODEX_ACTOR: ${{ github.actor }}
          CODEX_EVENT_NAME: ${{ github.event.label.name }}
        run: |
          $pullRequestNumber = [int]$env:CODEX_PULL_REQUEST_NUMBER
          $workerConfigPath = Join-Path $env:LOCALAPPDATA 'AutomationWorkbench\CodexWorker\config.json'
          if (-not (Test-Path -LiteralPath $workerConfigPath -PathType Leaf)) {
              throw "Codex worker configuration was not found at '$workerConfigPath'."
          }
          $workerConfig = Get-Content -Raw -LiteralPath $workerConfigPath | ConvertFrom-Json
          $repositoryRoot = [string]$workerConfig.repositoryRoot
          $dataRoot = [string]$workerConfig.dataRoot
          if ([string]::IsNullOrWhiteSpace($repositoryRoot) -or [string]::IsNullOrWhiteSpace($dataRoot)) {
              throw 'Codex worker configuration must specify repositoryRoot and dataRoot.'
          }
          Write-Host "CODEX WORKER | PR #$pullRequestNumber | REVISION DISPATCHING | event $env:CODEX_EVENT_NAME"
          & .\scripts\codex-worker\Invoke-Revision.ps1 `
              -Repository ([string]$env:CODEX_REPOSITORY) `
              -PullRequestNumber $pullRequestNumber `
              -Actor ([string]$env:CODEX_ACTOR) `
              -EventName ([string]$env:CODEX_EVENT_NAME) `
              -RepositoryRoot $repositoryRoot `
              -DataRoot $dataRoot | Out-Null
